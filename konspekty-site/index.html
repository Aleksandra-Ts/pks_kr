<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Конспекты — сети и КС</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <header class="sidebar__head">
        <h1>Конспекты</h1>
        <p class="sidebar__sub">Компьютерные сети · КС</p>
      </header>
      <div class="search-wrap">
        <input type="search" id="search" placeholder="Поиск по темам…" autocomplete="off" />
      </div>
      <nav class="nav" id="nav"></nav>
      <footer class="sidebar__foot">
        <p>Статический сайт — можно на <strong>GitHub Pages</strong>.</p>
        <p>Локально: <code>python -m http.server</code> в этой папке.</p>
      </footer>
    </aside>
    <button type="button" class="sidebar-toggle" id="sidebarToggle" aria-label="Меню">☰</button>
    <main class="main">
      <article class="doc" id="doc">
        <div class="welcome" id="welcome">
          <h2>Выберите тему слева</h2>
          <p>Конспекты по курсу и материалы к контрольной. Тексты в папке <code>content/</code>.</p>
        </div>
        <div class="doc__loading hidden" id="loading">Загрузка…</div>
        <div class="doc__error hidden" id="error"></div>
        <div class="doc__body markdown-body hidden" id="content"></div>
      </article>
    </main>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
